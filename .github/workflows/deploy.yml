name: Deploy site

# Runs when content is pushed (including the commits the backend makes for approved stories, team changes,
# events and profile updates), once a day (so event status flips from upcoming to past), and on demand.
on:
  push:
    branches: [main]
    paths-ignore: ['server/**', 'README.md']
  schedule:
    - cron: '30 18 * * *'   # 00:00 IST
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static site
        run: node build.mjs
        env:
          GDG_API_BASE: ${{ vars.GDG_API_BASE }}
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
